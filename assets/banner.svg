<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="social-media-posting — one idea, seven versions">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DB2777"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FCE7F3"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <circle cx="1050" cy="60" r="90" fill="#FFFFFF" opacity="0.08"/>
  <circle cx="110" cy="300" r="70" fill="#FFFFFF" opacity="0.08"/>
  <circle cx="980" cy="300" r="40" fill="#FFFFFF" opacity="0.10"/>
  <text x="60" y="90" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="bold" fill="#FFFFFF">social-media-posting</text>
  <text x="60" y="135" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#FBCFE8">One idea. Seven versions. Never copy-paste.</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="60" y="170" width="190" height="54" rx="27" fill="#FFFFFF"/>
    <text x="155" y="205" font-size="22" font-weight="bold" fill="#9D174D" text-anchor="middle">7 platforms</text>
    <rect x="270" y="170" width="190" height="54" rx="27" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="365" y="205" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Drafts only</text>
    <rect x="480" y="170" width="220" height="54" rx="27" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="590" y="205" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Own hook each</text>
  </g>
  <g>
    <rect x="750" y="150" width="390" height="130" rx="16" fill="url(#card)"/>
    <text x="780" y="190" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#9D174D">YouTube  •  Instagram  •  TikTok</text>
    <text x="780" y="220" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#444444">Facebook  •  Bilibili  •  LinkedIn  •  X</text>
    <text x="780" y="252" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#444444">Same facts. Different voice.</text>
  </g>
  <text x="60" y="320" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#F5D0FE">Each platform gets its own hook, length, and hashtags — you post, it never publishes</text>
</svg>
